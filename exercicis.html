<!--
    =====================================================================
    PROGRAMACIÓ D'APLICACIONS A INTERNET (UAB) · Arnau Sánchez
    =====================================================================
    Tots els exercicis són en aquest fitxer, cadascun comentat.
    Per executar-ne un, esborra les dues línies marcades amb
    "INICI EXERCICI N" i "FI EXERCICI N" (són les que obren i tanquen
    el comentari) i obre aquest fitxer al navegador.
    Cada exercici té els estils limitats al seu propi contenidor
    (#exercici1, #exercici2...), així que no es barregen entre ells.
    =====================================================================
-->


<!-- ===================== EXERCICI 1: HTML i CSS ======================
     Rèplica de l'estructura de pixar.com
     a. Fons blanc, títol a dalt a l'esquerra
     b. Menú horitzontal superior alineat a la dreta (ressaltat amb :hover)
     c. Imatges dins de caixes (.caixa)
     d. Clicar una imatge inferior mostra una "pàgina" amb aquesta imatge
        com a principal; l'antiga principal ocupa el seu lloc a baix.
        Les pàgines són seccions (#inici, #careers, #soul, #trailers)
        que es mostren amb el selector :target.
     ================================================================== -->
<!-- INICI EXERCICI 1  (esborra aquesta línia per executar-lo)

<style>
    /* Fons blanc (a) i estils generals */
    #exercici1 { max-width: 1000px; margin: 0 auto; padding: 0 20px;
                 background-color: #ffffff; color: #333333;
                 font-family: "Helvetica Neue", Arial, sans-serif; }
    #exercici1 * { box-sizing: border-box; }
    #exercici1 a { color: inherit; text-decoration: none; }

    /* Cada "pagina" es una seccio: nomes se'n veu una a la vegada.
       La seccio clicada (:target) es mostra i la d'inici s'amaga. */
    #exercici1 .pagina { display: none; }
    #exercici1 .pagina:target { display: block; }
    #exercici1 #inici { display: block; }
    #exercici1 .pagina:target ~ #inici { display: none; }

    /* Capcalera: titol a l'esquerra (a) i menu a la dreta (b) */
    #exercici1 .capcalera { display: flex; justify-content: space-between;
                            align-items: center; padding: 30px 20px; }
    #exercici1 .titol { margin: 0; font-family: Georgia, "Times New Roman", serif;
                        font-size: 26px; font-weight: normal; letter-spacing: 12px; color: #000000; }
    #exercici1 .menu ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
    #exercici1 .menu a { display: block; padding: 6px 8px; font-size: 12px; letter-spacing: 1px;
                         text-transform: uppercase; color: #555555;
                         border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
    /* Ressaltat dels elements del menu */
    #exercici1 .menu a:hover, #exercici1 .menu a.actiu { color: #000000; border-bottom-color: #000000; }

    /* Imatges dins de caixes (c) */
    #exercici1 .caixa { overflow: hidden; }
    #exercici1 .caixa img { display: block; width: 100%; height: 100%; object-fit: cover; }
    #exercici1 .principal { height: 380px; margin: 20px 0 60px 0; }

    /* Tres imatges inferiors (d) */
    #exercici1 .destacats { display: flex; justify-content: space-between; gap: 30px; padding: 0 20px; }
    #exercici1 .destacat { flex: 1; text-align: center; }
    #exercici1 .destacat .caixa { height: 180px; transition: transform 0.2s, box-shadow 0.2s; }
    #exercici1 .destacat a:hover .caixa { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25); }
    #exercici1 .peu-imatge { margin: 22px 0 0 0; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
    #exercici1 .destacat a:hover .peu-imatge { color: #000000; font-weight: bold; }

    /* Peu de pagina */
    #exercici1 .peu { margin-top: 60px; padding-bottom: 60px; text-align: center; }
    #exercici1 .boto-streaming { display: inline-block; margin-bottom: 30px; padding: 10px 22px;
                                 border: 2px solid #1b3a8c; border-radius: 24px; color: #1b3a8c;
                                 font-weight: bold; letter-spacing: 1px; }
    #exercici1 .boto-streaming:hover { background-color: #1b3a8c; color: #ffffff; }
    #exercici1 .xarxes { list-style: none; margin: 0 0 30px 0; padding: 0;
                         display: flex; justify-content: center; gap: 14px; }
    #exercici1 .xarxes a { display: inline-block; width: 30px; height: 30px; line-height: 30px;
                           border-radius: 50%; background-color: #222222; color: #ffffff;
                           font-size: 13px; font-weight: bold; }
    #exercici1 .xarxes a:hover { background-color: #666666; }
    #exercici1 .enllacos-legals { margin: 6px 0; font-size: 11px; letter-spacing: 3px;
                                  text-transform: uppercase; color: #777777; }
    #exercici1 .enllacos-legals a { border-bottom: 1px solid #cccccc; }
    #exercici1 .enllacos-legals a:hover { color: #000000; border-bottom-color: #000000; }
    #exercici1 .copyright { margin-top: 16px; font-size: 11px; letter-spacing: 4px; color: #777777; }
</style>
